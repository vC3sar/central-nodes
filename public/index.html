<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termux Node Command Board</title>

    <style>
        :root {
            --bg: #070b14;
            --panel: #0d1424;
            --panel-2: #111a2d;
            --border: #1f3150;
            --border-glow: #2f80ff66;
            --text: #dbeafe;
            --muted: #7f8da8;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, #12385f55, transparent 35%),
                radial-gradient(circle at 80% 80%, #30145c55, transparent 25%),
            linear-gradient(180deg, #050812, #080d18);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(#ffffff05 1px, transparent 1px),
                linear-gradient(90deg, #ffffff05 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .app {
            width: min(1500px, 100%);
            height: 100vh;
            margin: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #111a2d, #0a101d);
            box-shadow: 0 0 35px #2563eb25;
            padding: 16px 20px;
            border-radius: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: radial-gradient(circle, #ef4444, #3b0b16);
            box-shadow: 0 0 22px #ef444466;
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .status-pill {
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid #ef444477;
            color: #fecaca;
            background: #450a0a66;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 20px #ef444433;
        }

        .layout {
            margin-top: 0;
            display: grid;
            grid-template-columns: 280px 1fr 310px;
            gap: 18px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #0f172aee, #080d18ee);
            border-radius: 10px;
            box-shadow: inset 0 0 30px #00000050, 0 0 25px #1d4ed820;
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        .panel-body {
            padding: 16px;
            overflow: auto;
            min-height: 0;
        }

        .node-card,
        .alert-card,
        .service-card {
            border: 1px solid #1e293b;
            background: linear-gradient(180deg, #121c31, #0b1220);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .node-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 18px #2563eb35;
        }
        .service-card.active {
            border-color: #22d3ee;
            box-shadow: 0 0 22px #22d3ee40;
            background: linear-gradient(180deg, #16304d, #0b1220);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: 13px;
            font-weight: 800;
        }

        .sub {
            margin-top: 4px;
            font-size: 11px;
            color: var(--muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .safe {
            background: #052e1a;
            color: #86efac;
        }

        .warn {
            background: #422006;
            color: #fde68a;
        }

        .fail {
            background: #450a0a;
            color: #fca5a5;
        }

        .topology {
            height: clamp(220px, 42vh, 440px);
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .core {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, #ef4444, #7f1d1d 55%, transparent 60%);
            box-shadow: 0 0 50px #ef4444aa;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
        }

        .ring {
            position: absolute;
            border: 1px solid #ef444455;
            border-radius: 50%;
            animation: pulse 3s infinite;
        }

        .ring.r1 {
            width: 150px;
            height: 150px;
        }

        .ring.r2 {
            width: 240px;
            height: 240px;
            animation-delay: .7s;
        }

        .ring.r3 {
            width: 340px;
            height: 340px;
            animation-delay: 1.4s;
        }

        @keyframes pulse {
            0% {
                opacity: .2;
                transform: scale(.9);
            }

            50% {
                opacity: .8;
            }

            100% {
                opacity: .1;
                transform: scale(1.1);
            }
        }

        .dot {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 25px var(--cyan);
            cursor: pointer;
            z-index: 3;
        }

        .dot-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            color: #b6c4df;
            text-align: center;
            line-height: 1.35;
        }

        .dot-label .ip {
            color: #7f8da8;
        }

        .dot.active {
            outline: 2px solid #22d3ee;
            outline-offset: 4px;
        }

        .line.active {
            height: 2px;
            opacity: 1;
            background: linear-gradient(90deg, transparent, #22d3ee, #22d3ee, transparent);
            box-shadow: 0 0 14px #22d3eeaa;
        }

        .d1 {
            top: 80px;
            left: 25%;
        }

        .d2 {
            top: 90px;
            right: 20%;
        }

        .d3 {
            bottom: 90px;
            left: 33%;
            background: var(--green);
            box-shadow: 0 0 25px var(--green);
        }

        .d4 {
            bottom: 105px;
            right: 28%;
        }

        .d5 {
            top: 53%;
            right: 12%;
        }

        .line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #22d3ee99, transparent);
            transform-origin: left;
            opacity: .7;
        }

        .chart {
            height: clamp(130px, 20vh, 190px);
            display: flex;
            align-items: end;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }

        .bar {
            flex: 1;
            border-radius: 5px 5px 0 0;
            background: linear-gradient(180deg, #22d3ee, #0e7490);
            box-shadow: 0 0 15px #22d3ee33;
        }

        .alert-card {
            border-left: 4px solid var(--red);
        }

        .alert-card.warn-border {
            border-left-color: var(--yellow);
        }

        .log {
            font-family: Consolas, monospace;
            font-size: 11px;
            color: #8fa7c7;
            line-height: 1.7;
            max-height: 280px;
            overflow: auto;
        }

        .log b {
            color: #f87171;
        }

        .timeline {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 28px 16px;
        }

        .timeline span {
            height: 3px;
            flex: 1;
            background: #1e40af;
            box-shadow: 0 0 14px #3b82f6;
        }

        .timeline .point {
            width: 18px;
            height: 18px;
            border: 3px solid #3b82f6;
            border-radius: 50%;
            background: #0b1220;
            box-shadow: 0 0 15px #3b82f6;
        }

        @media (max-width: 1100px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100vh;
            }

            .layout {
                grid-template-columns: 1fr;
                overflow: visible;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .panel,
            .panel-body {
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo"></div>
                <div>
                    <h1>Node Control Panel</h1>
                    <span>MAIN SERVER // mx.nodes.vazquessg.ovh</span>
                </div>
            </div>

            <div class="status-pill" id="statusPill">● 0 ALERTAS ACTIVAS</div>
        </header>

        <section class="layout">
            <aside class="panel">
                <div class="panel-header">Node Services</div>
                <div class="panel-body" id="servicesList">
                    <div class="panel-header" style="padding-left:0;">Health Checks</div>

                    <div id="healthChecks"></div>
                </div>
            </aside>

            <section>
                <div class="panel">
                    <div class="panel-header">Network Topology</div>

                    <div class="topology">
                        <div class="ring r1"></div>
                        <div class="ring r2"></div>
                        <div class="ring r3"></div>

                        <div class="core">MAIN<br>SERVER</div>

                        <div id="topologyDots"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:18px;">
                    <div class="panel-header">Incident Timeline</div>
                    <div class="timeline">
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:18px;">
                    <div class="panel-header">Traffic / Node Activity</div>
                    <div class="chart" id="trafficChart"></div>
                </div>
            </section>

            <aside class="panel">
                <div class="panel-header">Active Alerts</div>
                <div class="panel-body" id="alertsList">

                    <div class="panel-header" style="padding-left:0;">Incident Logs</div>

                    <div class="log" id="incidentLog"></div>
                </div>
            </aside>
        </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusPill = document.getElementById("statusPill");
        const servicesList = document.getElementById("servicesList");
        const healthChecks = document.getElementById("healthChecks");
        const topologyDots = document.getElementById("topologyDots");
        const trafficChart = document.getElementById("trafficChart");
        const alertsList = document.getElementById("alertsList");
        const incidentLog = document.getElementById("incidentLog");

        let nodes = [];
        let logs = [];
        let selectedNodeId = null;

        const dotSlots = [
            { cls: "d1", x: 25, y: 22 },
            { cls: "d2", x: 80, y: 25 },
            { cls: "d3", x: 33, y: 78 },
            { cls: "d4", x: 72, y: 74 },
            { cls: "d5", x: 88, y: 53 },
        ];

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function timeSince(lastSeen) {
            const diffMs = Date.now() - Number(lastSeen || 0);
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return "hace segundos";
            if (mins === 1) return "hace 1 min";
            return `hace ${mins} min`;
        }

        function renderServices() {
            const cards = nodes.map((node) => {
                const isOnline = node.status === "online";
                const badgeClass = isOnline ? "safe" : "fail";
                const badgeText = isOnline ? "Online" : "Offline";
                const subtitle = node.localIp || node.ip || `Último reporte: ${timeSince(node.lastSeen)}`;
                const isSelected = selectedNodeId === node.nodeId;
                return `
                    <div class="service-card ${isSelected ? "active" : ""}" data-node-id="${esc(node.nodeId)}">
                        <div class="row">
                            <div>
                                <div class="title">${esc(node.name || node.nodeId)}</div>
                                <div class="sub">${esc(subtitle)}</div>
                            </div>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="row" style="margin-top:8px;">
                            <input type="text" data-role="name-input" data-node-id="${esc(node.nodeId)}" value="${esc(node.name || node.nodeId)}" style="width:100%; background:#0b1220; color:#dbeafe; border:1px solid #1e293b; border-radius:6px; padding:6px 8px; font-size:11px;">
                            <button data-role="save-name" data-node-id="${esc(node.nodeId)}" style="background:#0c4a6e; color:#dbeafe; border:1px solid #0369a1; border-radius:6px; padding:6px 8px; font-size:11px; cursor:pointer;">Guardar</button>
                        </div>
                    </div>
                `;
            }).join("");

            const healthHeader = `<div class="panel-header" style="padding-left:0;">Health Checks</div>`;
            servicesList.innerHTML = cards + healthHeader + `<div id="healthChecks"></div>`;
        }

        function renderHealthChecks() {
            const online = nodes.filter((n) => n.status === "online");
            const avgCpu = online.length
                ? Math.round(online.reduce((acc, n) => acc + (Number(n.cpuLoad) || 0), 0) / online.length)
                : 0;
            const lowBattery = nodes.filter((n) => typeof n.battery === "number" && n.battery < 20).length;

            const cpuStatus = avgCpu > 85 ? "warn" : "safe";
            const batteryStatus = lowBattery > 0 ? "warn" : "safe";

            const healthEl = document.getElementById("healthChecks");
            healthEl.innerHTML = `
                <div class="node-card ${cpuStatus === "safe" ? "active" : ""}">
                    <div class="row">
                        <div>
                            <div class="title">CPU Monitor</div>
                            <div class="sub">Carga promedio ${avgCpu}%</div>
                        </div>
                        <span class="badge ${cpuStatus}">${cpuStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
                <div class="node-card">
                    <div class="row">
                        <div>
                            <div class="title">Battery Watch</div>
                            <div class="sub">${lowBattery} nodo(s) bajo 20%</div>
                        </div>
                        <span class="badge ${batteryStatus}">${batteryStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
            `;
        }

        function renderTopology() {
            const coreX = 50;
            const coreY = 50;

            const lines = nodes.slice(0, 5).map((node, index) => {
                const slot = dotSlots[index] || dotSlots[0];
                const dx = coreX - slot.x;
                const dy = coreY - slot.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                const active = selectedNodeId === node.nodeId;
                return `<div class="line ${active ? "active" : ""}" style="left:${slot.x}%; top:${slot.y}%; width:${length}%; transform: rotate(${angle}deg);"></div>`;
            }).join("");

            const dots = nodes.slice(0, 5).map((node, index) => {
                const slot = dotSlots[index] || dotSlots[0];
                const online = node.status === "online";
                const active = selectedNodeId === node.nodeId;
                const colorStyle = online ? "" : "background: var(--red); box-shadow: 0 0 25px var(--red);";
                const ipText = node.localIp || node.ip || "-";
                return `
                  <div class="dot ${slot.cls} ${active ? "active" : ""}" data-node-id="${esc(node.nodeId)}" style="${colorStyle}">
                    <div class="dot-label">
                      <div>${esc(node.name || node.nodeId)}</div>
                      <div class="ip">${esc(ipText)}</div>
                    </div>
                  </div>
                `;
            }).join("");

            topologyDots.innerHTML = lines + dots;
        }

        function renderChart() {
            const values = nodes.slice(0, 10).map((node) => {
                if (typeof node.cpuLoad === "number") {
                    return Math.max(8, Math.min(100, Math.round(node.cpuLoad)));
                }
                if (typeof node.battery === "number") {
                    return Math.max(8, Math.min(100, Math.round(node.battery)));
                }
                return node.status === "online" ? 40 : 12;
            });

            while (values.length < 10) values.push(10);

            trafficChart.innerHTML = values.map((value) => (
                `<div class="bar" style="height:${value}%;"></div>`
            )).join("");
        }

        function renderAlerts() {
            const alerts = [];
            const offlineNodes = nodes.filter((n) => n.status !== "online");
            const lowBatteryNodes = nodes.filter((n) => typeof n.battery === "number" && n.battery < 20);

            for (const node of offlineNodes) {
                alerts.push({
                    type: "fail",
                    title: "NODE OFFLINE",
                    message: `${node.name || node.nodeId} no responde`,
                });
            }

            for (const node of lowBatteryNodes) {
                alerts.push({
                    type: "warn",
                    title: "BATTERY LOW",
                    message: `${node.name || node.nodeId} debajo de 20%`,
                });
            }

            const cards = alerts.map((alert) => `
                <div class="alert-card ${alert.type === "warn" ? "warn-border" : ""}">
                    <div class="title">${esc(alert.title)}</div>
                    <div class="sub">${esc(alert.message)}</div>
                </div>
            `).join("");

            const header = `<div class="panel-header" style="padding-left:0;">Incident Logs</div>`;
            alertsList.innerHTML = (cards || `<div class="sub" style="margin-bottom:12px;">Sin alertas activas</div>`) + header + `<div class="log" id="incidentLog"></div>`;
            statusPill.textContent = `● ${alerts.length} ALERTAS ACTIVAS`;
        }

        function renderLogs() {
            const logEl = document.getElementById("incidentLog");
            logEl.innerHTML = logs.slice(0, 20).map((entry) => {
                const hhmm = new Date(entry.time).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
                const isWarn = entry.type === "warn" || entry.type === "error";
                const text = `[${hhmm}] ${entry.message}`;
                return isWarn ? `<b>${esc(text)}</b><br>` : `${esc(text)}<br>`;
            }).join("");
        }

        function renderAll() {
            if (selectedNodeId && !nodes.some((n) => n.nodeId === selectedNodeId)) {
                selectedNodeId = null;
            }
            renderServices();
            renderHealthChecks();
            renderTopology();
            renderChart();
            renderAlerts();
            renderLogs();
        }

        async function init() {
            try {
                const [nodesRes, logsRes] = await Promise.all([
                    fetch("/api/nodes"),
                    fetch("/api/logs")
                ]);
                nodes = await nodesRes.json();
                logs = await logsRes.json();
                renderAll();
            } catch (error) {
                console.error("Error al cargar datos iniciales", error);
            }

            const socket = io();
            socket.on("nodes:update", (nextNodes) => {
                nodes = Array.isArray(nextNodes) ? nextNodes : [];
                renderAll();
            });
            socket.on("logs:init", (nextLogs) => {
                logs = Array.isArray(nextLogs) ? nextLogs : [];
                renderLogs();
            });
            socket.on("log:new", (newLog) => {
                logs.unshift(newLog);
                logs = logs.slice(0, 300);
                renderLogs();
            });

            topologyDots.addEventListener("click", (event) => {
                const dot = event.target.closest(".dot[data-node-id]");
                if (!dot) return;
                selectedNodeId = dot.dataset.nodeId;
                renderAll();
            });

            servicesList.addEventListener("click", async (event) => {
                const button = event.target.closest("button[data-role='save-name']");
                const card = event.target.closest(".service-card[data-node-id]");

                if (card) {
                    selectedNodeId = card.dataset.nodeId;
                    renderAll();
                }

                if (!button) return;

                const nodeId = button.dataset.nodeId;
                const input = servicesList.querySelector(`input[data-role='name-input'][data-node-id='${CSS.escape(nodeId)}']`);
                const name = input?.value?.trim();
                if (!name) return;

                try {
                    await fetch(`/api/node/${encodeURIComponent(nodeId)}/name`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name }),
                    });
                } catch (error) {
                    console.error("Error al guardar nombre", error);
                }
            });
        }

        init();
    </script>
</body>

</html>
