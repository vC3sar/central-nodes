<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termux Node Command Board</title>

    <style>
        :root {
            --bg-0: #eef3fb;
            --bg-1: #dfe8f5;
            --glass: rgba(255, 255, 255, 0.52);
            --glass-strong: rgba(255, 255, 255, 0.68);
            --border: rgba(255, 255, 255, 0.72);
            --text: #0f172a;
            --muted: #5b6678;
            --line: #c7d2e5;
            --accent: #2563eb;
            --ok: #16a34a;
            --warn: #ca8a04;
            --bad: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background:
                radial-gradient(circle at 20% 0%, #ffffffaa, transparent 35%),
                radial-gradient(circle at 100% 100%, #d7e3f6, transparent 34%),
                linear-gradient(180deg, var(--bg-0), var(--bg-1));
            color: var(--text);
            font-family: "SF Pro Display", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(#ffffff33 1px, transparent 1px),
                linear-gradient(90deg, #ffffff33 1px, transparent 1px);
            background-size: 42px 42px;
            pointer-events: none;
        }

        .app {
            width: min(1600px, 100%);
            height: 100vh;
            margin: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.09);
            padding: 18px 22px;
            border-radius: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(145deg, #dce7f8, #f8fbff);
            box-shadow: inset 0 1px 0 #fff, 0 8px 20px rgba(37, 99, 235, 0.18);
        }

        .brand h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: .3px;
            font-weight: 650;
        }

        .brand span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: .2px;
        }

        .status-pill {
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid #ffd9d9;
            color: #9f1239;
            background: #fff7f7;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(159, 18, 57, 0.08);
        }

        .layout {
            margin-top: 0;
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 20px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--line);
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .7px;
            text-transform: none;
        }

        .panel-body {
            padding: 18px;
            overflow: auto;
            min-height: 0;
        }

        .node-card,
        .alert-card,
        .service-card {
            border: 1px solid #d8e0ee;
            background: var(--glass-strong);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        }

        .node-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 18px #2563eb35;
        }
        .service-card.active {
            border-color: #b7ccf2;
            box-shadow: 0 0 0 2px #dbeafe, 0 10px 26px rgba(37, 99, 235, 0.12);
            background: #f8fbff;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: 14px;
            font-weight: 650;
        }

        .sub {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 650;
            text-transform: none;
        }

        .safe {
            background: #ebf9f0;
            color: #166534;
        }

        .warn {
            background: #fff8e7;
            color: #854d0e;
        }

        .fail {
            background: #fff1f2;
            color: #9f1239;
        }

        .topology {
            height: clamp(220px, 42vh, 440px);
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .core {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #d9e6fb);
            box-shadow: inset 0 1px 0 #fff, 0 14px 28px rgba(15, 23, 42, 0.16);
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            color: #1e293b;
        }

        .ring {
            position: absolute;
            border: 1px solid #c9d6eb;
            border-radius: 50%;
            animation: pulse 3s infinite;
        }

        .ring.r1 {
            width: 150px;
            height: 150px;
        }

        .ring.r2 {
            width: 240px;
            height: 240px;
            animation-delay: .7s;
        }

        .ring.r3 {
            width: 340px;
            height: 340px;
            animation-delay: 1.4s;
        }

        @keyframes pulse {
            0% {
                opacity: .2;
                transform: scale(.9);
            }

            50% {
                opacity: .8;
            }

            100% {
                opacity: .1;
                transform: scale(1.1);
            }
        }

        .dot {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
            cursor: pointer;
            z-index: 3;
        }

        .dot-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            color: #334155;
            text-align: center;
            line-height: 1.35;
        }

        .dot-label .ip {
            color: #64748b;
        }

        .dot.active {
            outline: 2px solid #93c5fd;
            outline-offset: 4px;
        }

        .line.active {
            stroke-width: 1.2;
            opacity: 1;
            stroke: #3b82f6;
            filter: drop-shadow(0 0 2px #93c5fd);
        }

        .d1 {
            top: 80px;
            left: 25%;
        }

        .d2 {
            top: 90px;
            right: 20%;
        }

        .d3 {
            bottom: 90px;
            left: 33%;
            background: var(--green);
            box-shadow: 0 0 25px var(--green);
        }

        .d4 {
            bottom: 105px;
            right: 28%;
        }

        .d5 {
            top: 53%;
            right: 12%;
        }

        .line {
            stroke: #a6bddf;
            stroke-width: 1;
            opacity: .7;
        }

        .topology-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .chart {
            height: clamp(130px, 20vh, 190px);
            display: flex;
            align-items: end;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }

        .bar {
            flex: 1;
            border-radius: 5px 5px 0 0;
            background: linear-gradient(180deg, #7fb0ff, #4f7ecf);
            box-shadow: 0 4px 12px rgba(79, 126, 207, 0.24);
        }

        .alert-card {
            border-left: 4px solid var(--bad);
        }

        .alert-card.warn-border {
            border-left-color: var(--warn);
        }

        .log {
            font-family: "SF Mono", Consolas, monospace;
            font-size: 11px;
            color: #526079;
            line-height: 1.7;
            max-height: 280px;
            overflow: auto;
        }

        .log b {
            color: #b91c1c;
        }

        .timeline {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 28px 16px;
        }

        .timeline span {
            height: 3px;
            flex: 1;
            background: #8ea8cf;
            box-shadow: 0 0 8px rgba(79, 126, 207, 0.4);
        }

        .timeline .point {
            width: 18px;
            height: 18px;
            border: 3px solid #6288c5;
            border-radius: 50%;
            background: #f7fbff;
            box-shadow: 0 0 10px rgba(79, 126, 207, 0.35);
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 16px;
        }
        .modal-backdrop.open {
            display: flex;
        }
        .modal {
            width: min(760px, 100%);
            max-height: 85vh;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--glass-strong);
            backdrop-filter: blur(20px) saturate(135%);
            -webkit-backdrop-filter: blur(20px) saturate(135%);
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }
        .modal-title {
            font-size: 14px;
            font-weight: 800;
        }
        .modal-close {
            border: 1px solid #d8e0ee;
            color: #334155;
            background: #f7fbff;
            border-radius: 7px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .modal-body {
            padding: 14px 16px 16px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .kv {
            border: 1px solid #d8e0ee;
            border-radius: 8px;
            background: #f9fbff;
            padding: 10px;
        }
        .kv .k {
            color: #7f8da8;
            font-size: 11px;
        }
        .kv .v {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 700;
            word-break: break-word;
        }
        @media (max-width: 700px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1100px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100vh;
            }

            .layout {
                grid-template-columns: 1fr;
                overflow: visible;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .panel,
            .panel-body {
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo"></div>
                <div>
                    <h1>Node Control Panel</h1>
                    <span>MAIN SERVER // mx.nodes.vazquessg.ovh</span>
                </div>
            </div>

            <div class="status-pill" id="statusPill">● 0 ALERTAS ACTIVAS</div>
        </header>

        <section class="layout">
            <aside class="panel">
                <div class="panel-header">Node Services</div>
                <div class="panel-body" id="servicesList">
                    <div class="panel-header" style="padding-left:0;">Health Checks</div>

                    <div id="healthChecks"></div>
                </div>
            </aside>

            <section>
                <div class="panel">
                    <div class="panel-header">Network Topology</div>

                    <div class="topology">
                        <div class="ring r1"></div>
                        <div class="ring r2"></div>
                        <div class="ring r3"></div>

                        <div class="core">MAIN<br>SERVER</div>

                        <div id="topologyDots"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:18px;">
                    <div class="panel-header">Incident Timeline</div>
                    <div class="timeline">
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                        <span></span>
                        <div class="point"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:18px;">
                    <div class="panel-header">Traffic / Node Activity</div>
                    <div class="chart" id="trafficChart"></div>
                </div>
            </section>

            <aside class="panel">
                <div class="panel-header">Active Alerts</div>
                <div class="panel-body" id="alertsList">

                    <div class="panel-header" style="padding-left:0;">Incident Logs</div>

                    <div class="log" id="incidentLog"></div>
                </div>
            </aside>
        </section>
    </main>
    <div class="modal-backdrop" id="nodeModalBackdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nodeModalTitle">
            <div class="modal-head">
                <div class="modal-title" id="nodeModalTitle">Detalle de Nodo</div>
                <button class="modal-close" id="nodeModalClose" type="button">Cerrar</button>
            </div>
            <div class="modal-body" id="nodeModalBody"></div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusPill = document.getElementById("statusPill");
        const servicesList = document.getElementById("servicesList");
        const healthChecks = document.getElementById("healthChecks");
        const topologyDots = document.getElementById("topologyDots");
        const trafficChart = document.getElementById("trafficChart");
        const alertsList = document.getElementById("alertsList");
        const incidentLog = document.getElementById("incidentLog");
        const nodeModalBackdrop = document.getElementById("nodeModalBackdrop");
        const nodeModalClose = document.getElementById("nodeModalClose");
        const nodeModalTitle = document.getElementById("nodeModalTitle");
        const nodeModalBody = document.getElementById("nodeModalBody");

        let nodes = [];
        let logs = [];
        let selectedNodeId = null;
        let openedNodeId = null;

        const dotSlots = [
            { cls: "d1", x: 25, y: 22 },
            { cls: "d2", x: 80, y: 25 },
            { cls: "d3", x: 33, y: 78 },
            { cls: "d4", x: 72, y: 74 },
            { cls: "d5", x: 88, y: 53 },
        ];

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function timeSince(lastSeen) {
            const diffMs = Date.now() - Number(lastSeen || 0);
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return "hace segundos";
            if (mins === 1) return "hace 1 min";
            return `hace ${mins} min`;
        }
        function fmtBytes(bytes) {
            if (typeof bytes !== "number" || Number.isNaN(bytes)) return "-";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let v = bytes;
            let i = 0;
            while (v >= 1024 && i < units.length - 1) {
                v /= 1024;
                i += 1;
            }
            return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }
        function fmtUptime(seconds) {
            if (typeof seconds !== "number" || Number.isNaN(seconds)) return "-";
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}d ${h}h ${m}m`;
            return `${h}h ${m}m`;
        }
        function fmtTemp(temp) {
            return typeof temp === "number" ? `${temp.toFixed(1)} °C` : "-";
        }
        function openNodeModal(nodeId) {
            const node = nodes.find((n) => n.nodeId === nodeId);
            if (!node) return;
            openedNodeId = nodeId;
            nodeModalTitle.textContent = `Detalle Técnico: ${node.name || node.nodeId}`;
            const wifiSsid = node.wifi?.ssid || "-";
            const wifiIp = node.wifi?.ip || node.localIp || node.ip || "-";
            const rows = [
                ["Estado", node.status || "-"],
                ["Último reporte", timeSince(node.lastSeen)],
                ["Node ID", node.nodeId || "-"],
                ["IP", node.localIp || node.ip || "-"],
                ["Modelo", node.model || "-"],
                ["Android", node.android || "-"],
                ["Batería", typeof node.battery === "number" ? `${node.battery}%` : "-"],
                ["Cargando", typeof node.charging === "boolean" ? (node.charging ? "Sí" : "No") : "-"],
                ["Temperatura", fmtTemp(node.temperature)],
                ["CPU Load", typeof node.cpuLoad === "number" ? `${Math.round(node.cpuLoad)}%` : "-"],
                ["RAM usada", fmtBytes(node.ramUsed)],
                ["RAM total", fmtBytes(node.ramTotal)],
                ["Uptime", fmtUptime(node.uptime)],
                ["WiFi SSID", wifiSsid],
                ["WiFi IP", wifiIp],
                ["Servicios", Array.isArray(node.services) ? `${node.services.length}` : "0"],
            ];
            nodeModalBody.innerHTML = rows.map(([k, v]) => `
                <div class="kv">
                    <div class="k">${esc(k)}</div>
                    <div class="v">${esc(v)}</div>
                </div>
            `).join("");
            nodeModalBackdrop.classList.add("open");
        }
        function closeNodeModal() {
            openedNodeId = null;
            nodeModalBackdrop.classList.remove("open");
        }

        function renderServices() {
            const cards = nodes.map((node) => {
                const isOnline = node.status === "online";
                const badgeClass = isOnline ? "safe" : "fail";
                const badgeText = isOnline ? "Online" : "Offline";
                const subtitle = node.localIp || node.ip || `Último reporte: ${timeSince(node.lastSeen)}`;
                const isSelected = selectedNodeId === node.nodeId;
                return `
                    <div class="service-card ${isSelected ? "active" : ""}" data-node-id="${esc(node.nodeId)}">
                        <div class="row">
                            <div>
                                <div class="title">${esc(node.name || node.nodeId)}</div>
                                <div class="sub">${esc(subtitle)}</div>
                            </div>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="row" style="margin-top:8px;">
                            <input type="text" data-role="name-input" data-node-id="${esc(node.nodeId)}" value="${esc(node.name || node.nodeId)}" style="width:100%; background:#f8fbff; color:#0f172a; border:1px solid #d5dfef; border-radius:10px; padding:7px 10px; font-size:12px;">
                            <button data-role="save-name" data-node-id="${esc(node.nodeId)}" style="background:#f3f8ff; color:#1e3a8a; border:1px solid #bed2f3; border-radius:10px; padding:7px 10px; font-size:12px; cursor:pointer;">Guardar</button>
                        </div>
                    </div>
                `;
            }).join("");

            const healthHeader = `<div class="panel-header" style="padding-left:0;">Health Checks</div>`;
            servicesList.innerHTML = cards + healthHeader + `<div id="healthChecks"></div>`;
        }

        function renderHealthChecks() {
            const online = nodes.filter((n) => n.status === "online");
            const avgCpu = online.length
                ? Math.round(online.reduce((acc, n) => acc + (Number(n.cpuLoad) || 0), 0) / online.length)
                : 0;
            const lowBattery = nodes.filter((n) => typeof n.battery === "number" && n.battery < 20).length;
            const staleNodes = nodes.filter((n) => (Date.now() - Number(n.lastSeen || 0)) > 30_000).length;
            const hotNodes = nodes.filter((n) => typeof n.temperature === "number" && n.temperature >= 42).length;

            const cpuStatus = avgCpu > 85 ? "warn" : "safe";
            const batteryStatus = lowBattery > 0 ? "warn" : "safe";
            const heartbeatStatus = staleNodes > 0 ? "warn" : "safe";
            const thermalStatus = hotNodes > 0 ? "warn" : "safe";

            const healthEl = document.getElementById("healthChecks");
            healthEl.innerHTML = `
                <div class="node-card ${cpuStatus === "safe" ? "active" : ""}">
                    <div class="row">
                        <div>
                            <div class="title">CPU Monitor</div>
                            <div class="sub">Carga promedio ${avgCpu}%</div>
                        </div>
                        <span class="badge ${cpuStatus}">${cpuStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
                <div class="node-card">
                    <div class="row">
                        <div>
                            <div class="title">Battery Watch</div>
                            <div class="sub">${lowBattery} nodo(s) bajo 20%</div>
                        </div>
                        <span class="badge ${batteryStatus}">${batteryStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
                <div class="node-card">
                    <div class="row">
                        <div>
                            <div class="title">Heartbeat Freshness</div>
                            <div class="sub">${staleNodes} nodo(s) con reporte atrasado (&gt;30s)</div>
                        </div>
                        <span class="badge ${heartbeatStatus}">${heartbeatStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
                <div class="node-card">
                    <div class="row">
                        <div>
                            <div class="title">Thermal Watch</div>
                            <div class="sub">${hotNodes} nodo(s) con temperatura alta (&ge;42°C)</div>
                        </div>
                        <span class="badge ${thermalStatus}">${thermalStatus === "safe" ? "Safe" : "Warn"}</span>
                    </div>
                </div>
            `;
        }

        function renderTopology() {
            const dots = nodes.slice(0, 5).map((node, index) => {
                const slot = dotSlots[index] || dotSlots[0];
                const online = node.status === "online";
                const active = selectedNodeId === node.nodeId;
                const colorStyle = online ? "" : "background: var(--red); box-shadow: 0 0 25px var(--red);";
                const ipText = node.localIp || node.ip || "-";
                return `
                  <div class="dot ${slot.cls} ${active ? "active" : ""}" data-node-id="${esc(node.nodeId)}" style="${colorStyle}">
                    <div class="dot-label">
                      <div>${esc(node.name || node.nodeId)}</div>
                      <div class="ip">${esc(ipText)}</div>
                    </div>
                  </div>
                `;
            }).join("");

            topologyDots.innerHTML = `<svg class="topology-lines" preserveAspectRatio="none"></svg>${dots}`;
            drawTopologyLines();
        }

        function drawTopologyLines() {
            const topology = document.querySelector(".topology");
            const core = topology?.querySelector(".core");
            const svg = topologyDots.querySelector(".topology-lines");
            const dotEls = topologyDots.querySelectorAll(".dot[data-node-id]");
            if (!topology || !core || !svg) return;

            const containerRect = topology.getBoundingClientRect();
            const coreRect = core.getBoundingClientRect();
            const coreCx = coreRect.left - containerRect.left + (coreRect.width / 2);
            const coreCy = coreRect.top - containerRect.top + (coreRect.height / 2);

            svg.setAttribute("viewBox", `0 0 ${containerRect.width} ${containerRect.height}`);
            svg.setAttribute("width", `${containerRect.width}`);
            svg.setAttribute("height", `${containerRect.height}`);

            const lines = Array.from(dotEls).map((dotEl) => {
                const nodeId = dotEl.dataset.nodeId;
                const dotRect = dotEl.getBoundingClientRect();
                const dotCx = dotRect.left - containerRect.left + (dotRect.width / 2);
                const dotCy = dotRect.top - containerRect.top + (dotRect.height / 2);
                const active = selectedNodeId === nodeId ? "active" : "";
                return `<line class="line ${active}" x1="${dotCx}" y1="${dotCy}" x2="${coreCx}" y2="${coreCy}"></line>`;
            }).join("");

            svg.innerHTML = lines;
        }

        function renderChart() {
            const values = nodes.slice(0, 10).map((node) => {
                if (typeof node.cpuLoad === "number") {
                    return Math.max(8, Math.min(100, Math.round(node.cpuLoad)));
                }
                if (typeof node.battery === "number") {
                    return Math.max(8, Math.min(100, Math.round(node.battery)));
                }
                return node.status === "online" ? 40 : 12;
            });

            while (values.length < 10) values.push(10);

            trafficChart.innerHTML = values.map((value) => (
                `<div class="bar" style="height:${value}%;"></div>`
            )).join("");
        }

        function renderAlerts() {
            const alerts = [];
            const offlineNodes = nodes.filter((n) => n.status !== "online");
            const lowBatteryNodes = nodes.filter((n) => typeof n.battery === "number" && n.battery < 20);

            for (const node of offlineNodes) {
                alerts.push({
                    type: "fail",
                    title: "NODE OFFLINE",
                    message: `${node.name || node.nodeId} no responde`,
                });
            }

            for (const node of lowBatteryNodes) {
                alerts.push({
                    type: "warn",
                    title: "BATTERY LOW",
                    message: `${node.name || node.nodeId} debajo de 20%`,
                });
            }

            const cards = alerts.map((alert) => `
                <div class="alert-card ${alert.type === "warn" ? "warn-border" : ""}">
                    <div class="title">${esc(alert.title)}</div>
                    <div class="sub">${esc(alert.message)}</div>
                </div>
            `).join("");

            const header = `<div class="panel-header" style="padding-left:0;">Incident Logs</div>`;
            alertsList.innerHTML = (cards || `<div class="sub" style="margin-bottom:12px;">Sin alertas activas</div>`) + header + `<div class="log" id="incidentLog"></div>`;
            statusPill.textContent = `● ${alerts.length} ALERTAS ACTIVAS`;
        }

        function renderLogs() {
            const logEl = document.getElementById("incidentLog");
            logEl.innerHTML = logs.slice(0, 20).map((entry) => {
                const hhmm = new Date(entry.time).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
                const isWarn = entry.type === "warn" || entry.type === "error";
                const text = `[${hhmm}] ${entry.message}`;
                return isWarn ? `<b>${esc(text)}</b><br>` : `${esc(text)}<br>`;
            }).join("");
        }

        function renderAll() {
            if (selectedNodeId && !nodes.some((n) => n.nodeId === selectedNodeId)) {
                selectedNodeId = null;
            }
            renderServices();
            renderHealthChecks();
            renderTopology();
            renderChart();
            renderAlerts();
            renderLogs();
            if (openedNodeId) {
                openNodeModal(openedNodeId);
            }
        }

        async function init() {
            try {
                const [nodesRes, logsRes] = await Promise.all([
                    fetch("/api/nodes"),
                    fetch("/api/logs")
                ]);
                nodes = await nodesRes.json();
                logs = await logsRes.json();
                renderAll();
            } catch (error) {
                console.error("Error al cargar datos iniciales", error);
            }

            const socket = io();
            socket.on("nodes:update", (nextNodes) => {
                nodes = Array.isArray(nextNodes) ? nextNodes : [];
                renderAll();
            });
            socket.on("logs:init", (nextLogs) => {
                logs = Array.isArray(nextLogs) ? nextLogs : [];
                renderLogs();
            });
            socket.on("log:new", (newLog) => {
                logs.unshift(newLog);
                logs = logs.slice(0, 300);
                renderLogs();
            });

            topologyDots.addEventListener("click", (event) => {
                const dot = event.target.closest(".dot[data-node-id]");
                if (!dot) return;
                selectedNodeId = dot.dataset.nodeId;
                renderAll();
                openNodeModal(selectedNodeId);
            });

            servicesList.addEventListener("click", async (event) => {
                const button = event.target.closest("button[data-role='save-name']");
                const card = event.target.closest(".service-card[data-node-id]");

                if (card) {
                    selectedNodeId = card.dataset.nodeId;
                    renderAll();
                    openNodeModal(selectedNodeId);
                }

                if (!button) return;

                const nodeId = button.dataset.nodeId;
                const input = servicesList.querySelector(`input[data-role='name-input'][data-node-id='${CSS.escape(nodeId)}']`);
                const name = input?.value?.trim();
                if (!name) return;

                try {
                    await fetch(`/api/node/${encodeURIComponent(nodeId)}/name`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name }),
                    });
                } catch (error) {
                    console.error("Error al guardar nombre", error);
                }
            });

            window.addEventListener("resize", () => {
                drawTopologyLines();
            });
            nodeModalClose.addEventListener("click", closeNodeModal);
            nodeModalBackdrop.addEventListener("click", (event) => {
                if (event.target === nodeModalBackdrop) {
                    closeNodeModal();
                }
            });
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeNodeModal();
                }
            });
        }

        init();
    </script>
</body>

</html>
